<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yaman Elektrik">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Yaman Elektrik</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#f59e0b;--acd:#d97706;--ink:#0f172a;--ok:#16a34a;--err:#dc2626;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#151b2e;--tx:#e8ecf4;--mut:#8b96ad;--bd:#252d45;--ink:#05080f;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

header{background:linear-gradient(180deg,#0b1220 0%,#0f172a 100%);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 rgba(255,255,255,.05),0 6px 24px rgba(0,0,0,.35);border-bottom:1px solid rgba(245,158,11,.18)}
.hd{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;overflow:hidden}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 55%,#d97706 100%);display:grid;place-items:center;color:#0b1220;flex:none;box-shadow:0 4px 16px rgba(245,158,11,.4),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.12)}
.logo svg{width:22px;height:22px;fill:#0b1220;stroke:#0b1220;stroke-width:1.5;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.brand > div:last-child{min-width:0;overflow:hidden}
.brand b{font-size:clamp(13px,1.5vw + 9px,17.5px);font-weight:800;letter-spacing:.3px;display:block;line-height:1.15;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#94a3b8;font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.hb{display:flex;align-items:center;gap:7px;height:42px;padding:0 12px;border-radius:11px;background:rgba(255,255,255,.08);color:#fff;font-weight:500;font-size:14px;position:relative;transition:.15s;border:1px solid rgba(255,255,255,.06);flex:none}
.hb:hover{background:rgba(255,255,255,.14);border-color:rgba(245,158,11,.35)}
.hb.on{background:rgba(34,197,94,.18);color:#86efac;border-color:rgba(34,197,94,.35)}
.hb svg{width:24px;height:24px}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:#111;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media(max-width:620px){
  .hb .t{display:none}
  .hb{padding:0 10px;height:42px;gap:0}
  .hb svg{width:23px;height:23px}
}
@media(max-width:520px){
  .hd{height:60px;gap:8px}
  .brand{gap:9px}
  .logo{width:38px;height:38px;border-radius:11px}
  .logo svg{width:21px;height:21px}
  .brand small{font-size:9.5px;letter-spacing:1.2px;margin-top:2px}
  .acts{gap:5px}
  .hb{padding:0 9px;height:40px;border-radius:10px}
  .hb svg{width:22px;height:22px}
}
@media(max-width:400px){
  .hd{height:58px;gap:6px}
  .brand{gap:8px}
  .logo{width:36px;height:36px;border-radius:10px}
  .logo svg{width:19px;height:19px}
  .brand small{display:none}
  .acts{gap:4px}
  .hb{padding:0 8px;height:38px;border-radius:9px}
  .hb svg{width:21px;height:21px}
}
.adminbar{background:#14532d;color:#bbf7d0;font-size:13px;text-align:center;padding:6px}

.tb{display:flex;gap:10px;padding:16px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:0 14px 0 40px;outline:0;transition:.15s}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.dd{position:relative}
.ddb{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:500;min-width:190px;justify-content:space-between}
.ddb:hover{border-color:var(--ac)}
.ddb svg{width:16px;height:16px;color:var(--mut);transition:.2s}
.dd.open .ddb svg{transform:rotate(180deg)}
.ddm{position:absolute;right:0;top:50px;min-width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:6px;display:none;z-index:15}
.dd.open .ddm{display:block}
.ddm button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;text-align:left;white-space:nowrap}
.ddm button:hover{background:var(--bg)}
.ddm button.sel{color:var(--acd);font-weight:600}
@media(max-width:520px){.dd{width:100%}.ddb{width:100%}.ddm{left:0}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 15px;border-radius:18px;border:1px solid var(--bd);background:var(--card);white-space:nowrap;font-weight:500;font-size:14px;transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cnt{color:var(--mut);font-size:13px;padding:2px 2px 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding-bottom:110px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--bd);transition:.18s}
.card:hover{transform:translateY(-3px);border-color:rgba(245,158,11,.5)}
.ph{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,var(--bg),var(--bd));display:grid;place-items:center;color:var(--mut)}
.ph svg{width:38px;height:38px;opacity:.5}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;background:rgba(15,23,42,.78);color:#fff;font-size:11px;padding:3px 9px;border-radius:10px;backdrop-filter:blur(4px)}
.bd{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pr{font-size:20px;font-weight:800;letter-spacing:-.3px}
.adm{background:rgba(22,163,74,.09);border:1px solid rgba(22,163,74,.25);border-radius:10px;padding:7px 9px;font-size:12.5px;display:grid;gap:2px;color:var(--mut)}
.adm b{color:var(--ok)}
.add{margin-top:auto;height:42px;border-radius:11px;background:var(--ac);color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.add:hover{background:var(--acd);color:#fff}
.step{margin-top:auto;height:42px;border-radius:11px;border:1.5px solid var(--ac);display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.step button{width:46px;height:100%;font-size:20px;font-weight:600;color:var(--acd)}
.step button:hover{background:rgba(245,158,11,.14)}
.step span{font-weight:700;white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--mut)}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:8px}

.share-p{height:36px;width:100%;border-radius:10px;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.3);color:#166534;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;transition:.15s}
.share-p:hover{background:rgba(37,211,102,.18);border-color:#25d366}
.share-p svg{width:16px;height:16px}
@media (prefers-color-scheme:dark){.share-p{color:#86efac}}

.fld{display:grid;gap:5px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:600;color:var(--mut)}
.fld input{height:44px;width:100%;border-radius:11px;border:1px solid var(--bd);background:var(--bg);padding:0 12px;outline:0}
.fld input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal.tall{max-height:92vh;overflow:auto}
.btn.ed{height:34px;flex:none;font-size:13px}
.btn.dg{color:var(--err);border-color:rgba(220,38,38,.35)}
.btn.dg.arm{background:var(--err);color:#fff;border-color:var(--err)}
.kch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kch .chip{height:32px;font-size:13px;padding:0 13px}
.kch small{color:var(--mut)}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.wa:hover{background:#1ebe5b}
.ph.z{cursor:zoom-in}
#lb{background:rgba(2,6,23,.92);cursor:zoom-out}
#lb .lbw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
#lb .cap{color:#fff;text-align:center;max-width:560px}
#lb .cap b{display:block;font-size:17px}
#lb .cap span{color:var(--ac);font-weight:800;font-size:19px}
#lb .x{position:absolute;top:14px;right:14px;color:#fff;background:rgba(255,255,255,.14);width:42px;height:42px}
#top{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--ac);color:#111;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(12px);transition:.22s;z-index:19}
#top.show{opacity:1;pointer-events:auto;transform:none}
#top svg{width:22px;height:22px;stroke-width:2.6}
.fbar.show ~ #top{bottom:calc(88px + env(safe-area-inset-bottom))}
.u{font-size:12px;font-weight:600;color:var(--mut)}
.qi{border:0;background:none;text-align:center;font-weight:700;outline:0;padding:0;height:100%;min-width:0;color:inherit}
.step .qi{flex:1;width:50px}
.q .qi{width:46px;height:34px}
.mu{font-style:normal;color:var(--mut);font-size:12px;margin:0 6px 0 -8px}
#eov .modal{padding:16px 18px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow-y:auto}
#eov h3{font-size:17px;margin:0 0 10px}
#eov .modal > p{display:none}
#eov .fld{margin-bottom:9px;gap:4px}
#eov .fld label{font-size:12px}
#eov .fld input{height:40px}
#eov .err{min-height:0;margin:2px 2px 0}
#eov .err:empty{display:none}
#eov .mb{margin-top:8px}
#eov .btn{height:42px}
.kch{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:6px;padding-bottom:2px}
.kch::-webkit-scrollbar{display:none}
.kch .chip{flex:none}
.kch small{white-space:nowrap}
.tag{cursor:pointer;padding:4px 10px}
.tag:hover{background:var(--ac);color:#111}
.fld input.bad{border-color:var(--err)}
#lb{z-index:60}
#lb .adm2{display:inline-block;margin-top:10px;font-size:14px;color:#86efac;background:rgba(22,163,74,.2);border:1px solid rgba(34,197,94,.4);border-radius:10px;padding:6px 12px}
#lb .adm2:empty{display:none}
.ci .im.z{cursor:zoom-in}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:18;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none;transform:translateY(120%);transition:.25s}
.fbar.show{transform:none}
.fbar button{pointer-events:auto;max-width:560px;margin:0 auto;width:100%;height:54px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.fbar em{font-style:normal;background:var(--ac);color:#111;border-radius:9px;padding:2px 9px;font-weight:700;margin-right:8px}

.ov{position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(3px);z-index:50;display:none;opacity:0;transition:opacity .2s}
.ov.show{display:block}.ov.in{opacity:1}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:min(400px,calc(100% - 28px));background:var(--card);border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.4);transition:.2s}
.ov.in .modal{transform:translate(-50%,-50%)}
.modal h3{margin:0 0 4px;font-size:19px}.modal p{margin:0 0 16px;color:var(--mut);font-size:14px}
.mic{width:48px;height:48px;border-radius:14px;background:rgba(245,158,11,.15);color:var(--acd);display:grid;place-items:center;margin-bottom:14px}
.pw{position:relative}
.pw input{width:100%;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);padding:0 46px 0 14px;outline:0}
.pw input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.pw input.bad{border-color:var(--err)}
.pw button{position:absolute;right:4px;top:4px;width:40px;height:40px;color:var(--mut)}
.err{color:var(--err);font-size:13px;min-height:20px;margin:6px 2px 0}
.mb{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;height:46px;border-radius:12px;font-weight:600;border:1px solid var(--bd);background:var(--card)}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#111}
.btn.p:hover{background:var(--acd);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}

.drawer{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s}
.ov.in .drawer{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--bd);padding-top:calc(16px + env(safe-area-inset-top))}
.dh h3{margin:0;font-size:18px}
.x{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}.x:hover{background:var(--bg)}
.db{flex:1;overflow:auto;padding:6px 18px}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.ci .im{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--bg);flex:none;position:relative}
.ci .im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ci .in{flex:1;min-width:0}.ci .in b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.ci .in small{color:var(--mut)}
.q{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.q button{width:32px;height:34px;font-size:18px}.q button:hover{background:var(--bg)}
.q span{min-width:26px;padding:0 4px;text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.df{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800}
.lnk{color:var(--mut);font-size:13px;text-align:center}.lnk:hover{color:var(--err)}

#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:0 0 100px}
</style>
</head>
<body>
<header><div class="wrap hd">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <div><b>Yaman Elektrik</b><small>Elektrik malzemeleri</small></div>
  </div>
  <div class="acts">
    <button class="hb" id="inst" style="display:none" title="Uygulamayı yükle"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span class="t">Yükle</span></button>
    <button class="hb" id="shar" title="Paylaş"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span class="t">Paylaş</span></button>
    <button class="hb" id="loc" title="Konum"><svg viewBox="0 0 24 24"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="t">Konum</span></button>
    <button class="hb" id="lock"><svg viewBox="0 0 24 24" id="lockic"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="t" id="lockt">Giriş</span></button>
  </div>
</div></header>
<div class="adminbar" id="adminbar" style="display:none">Yönetici modu açık · alış fiyatları ve kâr görünüyor</div>

<main class="wrap">
  <div class="tb">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Ürün ara…" autocomplete="off"></label>
    <div class="dd" id="dd">
      <button class="ddb" id="ddb"><span id="ddl">Son eklenen</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="ddm" id="ddm"></div>
    </div>
    <button class="btn p" id="newb" style="display:none;flex:none;height:44px;padding:0 18px">＋ Yeni ürün</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="cnt" id="cnt"></div>
  <div class="grid" id="grid"></div>
  <div id="more"></div>
</main>
<footer>© Yaman Elektrik · Ferhat Erdoğan</footer>

<div class="fbar" id="fbar"><button id="fopen"><span><em id="fn">0</em>Sepeti görüntüle</span><span id="ft"></span></button></div>

<button id="top" aria-label="Yukarı çık"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>

<div class="ov" id="lov"><div class="modal">
  <div class="mic"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h3>Yönetici girişi</h3><p>Alış fiyatlarını görmek için parolanı gir.</p>
  <div class="pw"><input id="pw" type="password" placeholder="Parola" autocomplete="current-password">
    <button id="eye" type="button" aria-label="Göster"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="err" id="err"></div>
  <div class="mb"><button class="btn" id="lc">Vazgeç</button><button class="btn p" id="lok">Giriş yap</button></div>
</div></div>

<div class="ov" id="lb"><button class="x" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="lbw"><img id="lbi" alt=""><div class="cap"><b id="lbn"></b><span id="lbp"></span><br><div class="adm2" id="lba"></div></div></div></div>

<div class="ov" id="eov"><div class="modal tall">
  <h3 id="etitle">Yeni ürün</h3><p>Kaydedince CSV güncellenir, fiyat dosyaları yeniden oluşur.</p>

const ADMIN_PW_KEY = 'yaman_admin_pw';
const SHARE_NAME = '*Yaman Elektrik*\n\n*Ferhat Erdoğan*  05346381542\n\n*Murat Erdoğan*  05347151345';

const TL = n => n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₺';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BOX = '<svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>';
const SHARE_ICON = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>';
const SORTS = {new:['Son eklenen',(a,b)=>b.id-a.id], az:['Ada göre (A-Z)',(a,b)=>a.ad.localeCompare(b.ad,'tr')],
  lo:['Fiyat: düşükten yükseğe',(a,b)=>a.satis-b.satis], hi:['Fiyat: yüksekten düşüğe',(a,b)=>b.satis-a.satis]};
let P = [], costs = null, cart = {}, cat = '', sort = 'new', LOCAL = false, PW = '', shown = 24, LIST = [];

const MT_CATS = ['kablo','led','boru','bara'];
const isMt = p => !!p && MT_CATS.includes((p.kat || '').trim().toLowerCase());
const unit = p => isMt(p) ? 'mt' : 'adet';
const r2 = x => Math.round(x * 100) / 100;
const fmtQ = n => n.toLocaleString('tr-TR', {maximumFractionDigits: 2});
function qctl(p, n, c){
  const mid = isMt(p)
    ? `<input class="qi" inputmode="decimal" value="${fmtQ(n)}" onfocus="this.select()" onchange="setQty(${p.id},this.value)"><em class="mu">mt</em>`
    : `<span>${n} adet</span>`;
  return `<div class="${c}"><button onclick="add(${p.id},-1)">−</button>${mid}<button onclick="add(${p.id},1)">+</button></div>`;
}
function setQty(id, v){
  const n = parseFloat(String(v).replace(',', '.'));
  if(!(n > 0)) delete cart[id]; else cart[id] = Math.min(r2(n), 100000);
  save(); sum(); render(); if($('cov').classList.contains('show')) drawCart();
}
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch(e){}
const save = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch(e){} };
const img = p => p.resim ? `<img loading="lazy" src="${esc(p.resim)}" alt="" onerror="this.remove()">` : '';

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }
function openOv(id){ const o=$(id); o.classList.add('show'); requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('in'))); }
function closeOv(id){ const o=$(id); o.classList.remove('in'); setTimeout(()=>o.classList.remove('show'),220); }

async function init(){
  try { const r = await fetch('api.php?ping&t=' + Date.now()); const j = r.ok ? await r.json() : null; LOCAL = !!(j && j.php === true); } catch(e){ LOCAL = false; }
  if(!LOCAL && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  try { P = await (await fetch('products.json?' + Date.now())).json(); } catch(e){ P = []; }
  drawChips(); drawSort(); render(); sum();
  let savedPw = null;
  try { savedPw = localStorage.getItem(ADMIN_PW_KEY); } catch(_){}
  if(savedPw){
    try { costs = await unlock(savedPw); PW = savedPw; setAdmin(true); }
    catch(_){ try { localStorage.removeItem(ADMIN_PW_KEY); } catch(__){} }
  }
}
function drawChips(){
  const cs = ['', ...new Set(P.map(p=>p.kat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  $('chips').innerHTML = cs.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${c?esc(c):'Tümü'}</button>`).join('');
}
function drawSort(){
  $('ddl').textContent = SORTS[sort][0];
  $('ddm').innerHTML = Object.entries(SORTS).map(([k,v])=>`<button data-s="${k}" class="${k===sort?'sel':''}">${v[0]}${k===sort?'<svg viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m5 12 5 5 9-10"/></svg>':''}</button>`).join('');
}
function render(){
  const q = $('q').value.toLowerCase().trim();
  const L = P.filter(p=>(!cat||p.kat===cat)&&p.ad.toLowerCase().includes(q)).sort(SORTS[sort][1]);
  $('cnt').textContent = L.length + ' ürün'; LIST = L;
  $('grid').innerHTML = L.length ? L.slice(0,shown).map(p=>{
    const n = cart[p.id], c = costs && costs[p.id];
    return `<div class="card"><div class="ph${p.resim?' z':''}" ${p.resim?`onclick="zoom(${p.id})"`:''}>${BOX}${img(p)}${p.kat?`<span class="tag" data-k="${esc(p.kat)}" onclick="event.stopPropagation();pickCat(this.dataset.k)">${esc(p.kat)}</span>`:''}</div>
    <div class="bd"><div class="nm">${esc(p.ad)}</div><div class="pr">${TL(p.satis)}<span class="u"> / ${unit(p)}</span></div>
    ${costs?`<div class="adm"><span>Alış: ${TL(c)}</span><span>Kâr: <b>${TL(p.satis-c)}</b>${c?` (%${Math.round((p.satis-c)/c*100)})`:''}</span></div>`:''}
    ${costs&&LOCAL?`<button class="btn ed" onclick="edit(${p.id})">Düzenle</button>`:''}
    ${n?qctl(p,n,'step')
       :`<button class="add" onclick="add(${p.id},1)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Sepete ekle</button>`}
    <button class="share-p" onclick="shareProduct(${p.id})">${SHARE_ICON}Ürünü Paylaş</button>
    </div></div>`}).join('') : `<div class="empty">${BOX}<div>Ürün bulunamadı</div></div>`;
  watch();
}
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es => {
  if(es[0].isIntersecting && shown < LIST.length){ shown += STEP; render(); }
}, {rootMargin:'900px'}) : null;
function watch(){
  if(!io){ if(shown < LIST.length){ shown = LIST.length; render(); } return; }
  io.unobserve($('more'));
  if(shown < LIST.length) io.observe($('more'));
}
function pickCat(k){
  cat = k; shown = STEP; $('q').value = '';
  drawChips(); render();
  const on = $('chips').querySelector('.chip.on'); if(on) on.scrollIntoView({inline:'center', block:'nearest'});
  scrollTo(0, 0); $('q').blur();
}
function zoom(id){
  const p = P[id]; if(!p || !p.resim) return;
  $('lbi').src = p.resim; $('lbn').textContent = p.ad; $('lbp').textContent = TL(p.satis) + ' / ' + unit(p);
  const c = costs ? costs[id] : null;
  $('lba').textContent = c === null ? '' : `Alış: ${TL(c)} · Kâr: ${TL(p.satis - c)}` + (c ? ` (%${Math.round((p.satis - c) / c * 100)})` : '');
  openOv('lb');
}
$('lb').onclick = () => closeOv('lb');
function add(id,d){
  cart[id] = r2((cart[id]||0)+d); if(cart[id]<=0) delete cart[id];
  if(d>0 && cart[id]===1) toast('Sepete eklendi');
  save(); sum(); render(); if($('cov').classList.contains('show')) drawCart();
}
const total = () => Object.entries(cart).reduce((t,[id,n])=>t+(P[id]?P[id].satis*n:0),0);
function sum(){
  const n = Object.entries(cart).filter(([id])=>P[id]).length;
  const bd = $('badge'); if(bd){ bd.style.display = n?'grid':'none'; bd.textContent = n; }
  $('fbar').classList.toggle('show', n>0); $('fn').textContent = n; $('ft').textContent = TL(total());
}
function drawCart(){
  const E = Object.entries(cart).filter(([id])=>P[id]);
  $('cb').innerHTML = E.length ? E.map(([id,n])=>`<div class="ci"><div class="im${P[id].resim?' z':''}" ${P[id].resim?`onclick="zoom(${id})"`:''}>${img(P[id])}</div>
    <div class="in"><b>${esc(P[id].ad)}</b><small>${TL(P[id].satis)} / ${unit(P[id])} · ${TL(P[id].satis*n)}</small></div>
    ${qctl(P[id],n,'q')}</div>`).join('')
    : `<div class="empty" style="padding:50px 0">${BOX}<div>Sepetin boş</div></div>`;
  if(!E.length){ $('cf').innerHTML=''; return; }
  let h = `<div class="tot"><span>Toplam</span><span>${TL(total())}</span></div>`;
  if(costs){ const c=E.reduce((t,[id,n])=>t+costs[id]*n,0); h+=`<div class="adm"><span>Alış toplamı: ${TL(c)}</span><span>Kâr: <b>${TL(total()-c)}</b></span></div>`; }
  h += `<button class="btn wa" onclick="shareWA()">${WAI}WhatsApp'ta paylaş</button>`;
  if(PHONE) h += '<button class="btn p" onclick="orderWA()">Siparişi dükkana gönder</button>';
  if(costs) h += '<button class="btn" onclick="adminShareWA()">Sadece Ürün Adları ve Adetleri Paylaş</button>';
  h += '<button class="lnk" onclick="cart={};save();sum();render();drawCart()">Sepeti temizle</button>';
  $('cf').innerHTML = h;
}

  if(!/^(localhost|127\.|192\.168\.)/.test(location.hostname) && /^https?:/.test(location.protocol)) t += '\n' + location.origin + location.pathname;

/* ===== ÜRÜN GÖRSELİ OLUŞTURMA (premium) ===== */
function loadImage(src){
  return new Promise(res => {
    if(!src) return res(null);
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}
function drawImageCover(ctx, im, x, y, w, h){
  const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
  const sc = Math.max(w/iw, h/ih);
  const dw = iw*sc, dh = ih*sc;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.drawImage(im, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  ctx.restore();
}
function wrapText(ctx, text, x, y, maxW, lineH){
  const words = String(text).split(' ');
  let line = '', curY = y;
  for(const word of words){
    const test = line ? line + ' ' + word : word;
    if(ctx.measureText(test).width > maxW && line){
      ctx.fillText(line, x, curY); line = word; curY += lineH;
    } else line = test;
  }
  if(line) ctx.fillText(line, x, curY);
  return curY;
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function drawSpacedText(ctx, text, x, y, spacing){
  let cx = x;
  for(const ch of text){
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
}
function downloadFile(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

async function shareProduct(id){
  const p = P[id];
  if(!p) return;
  toast('Görsel hazırlanıyor…');
  try {
    const W = 1080, H = 1080, PAD = 70;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // 1) Arka plan: derin lacivert gradient
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0,    '#0a0e1a');
    bg.addColorStop(0.55, '#0f172a');
    bg.addColorStop(1,    '#1a2332');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Üstte hafif altın ışıltı
    const glow = ctx.createRadialGradient(W/2, -200, 0, W/2, -200, W);
    glow.addColorStop(0, 'rgba(245,158,11,0.16)');
    glow.addColorStop(1, 'rgba(245,158,11,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // 2) Ürün kartı
    const IMG_W = W - PAD*2;
    const IMG_H = 620;
    const IMG_Y = PAD + 20;
    const R = 28;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 50;
    ctx.shadowOffsetY = 24;
    roundRectPath(ctx, PAD, IMG_Y, IMG_W, IMG_H, R);
    ctx.fillStyle = '#111827';
    ctx.fill();
    ctx.restore();

    const im = await loadImage(p.resim);
    if(im){
      ctx.save();
      roundRectPath(ctx, PAD, IMG_Y, IMG_W, IMG_H, R);
      ctx.clip();
      drawImageCover(ctx, im, PAD, IMG_Y, IMG_W, IMG_H);
      ctx.restore();
    }

    roundRectPath(ctx, PAD, IMG_Y, IMG_W, IMG_H, R);
    ctx.strokeStyle = 'rgba(245,158,11,0.55)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 3) Ürün adı
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = '600 42px system-ui, -apple-system, "Segoe UI", sans-serif';
    const TX = PAD + 10;
    const TW = W - PAD*2 - 20;
    const ny = IMG_Y + IMG_H + 75;
    const nameEnd = wrapText(ctx, p.ad, TX, ny, TW, 54);

    // 4) Fiyat — altın gradient
    const py = nameEnd + 75;
    const priceGrad = ctx.createLinearGradient(TX, py, TX + 700, py + 80);
    priceGrad.addColorStop(0,   '#fbbf24');
    priceGrad.addColorStop(0.5, '#f59e0b');
    priceGrad.addColorStop(1,   '#b45309');
    ctx.fillStyle = priceGrad;
    ctx.font = '800 92px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.fillText(TL(p.satis) + ' / ' + unit(p), TX, py);

    // 5) Alt marka bandı
    const BAND_H = 130;
    const BAND_Y = H - BAND_H;
    ctx.fillStyle = 'rgba(245,158,11,0.65)';
    ctx.fillRect(PAD, BAND_Y, W - PAD*2, 2);

    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fbbf24';
    ctx.font = '700 34px system-ui, -apple-system, "Segoe UI", sans-serif';
    drawSpacedText(ctx, 'YAMAN ELEKTRİK', TX, BAND_Y + BAND_H/2, 10);

    // 6) Blob → File → paylaş
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if(!blob){ toast('Görsel oluşturulamadı'); return; }
    const filename = 'yaman-urun.png';
    const file = new File([blob], filename, { type: 'image/png' });
    const shareText = location.origin + location.pathname;

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], text: shareText });
        return;
      } catch(err){
        if(err.name === 'AbortError') return;
      }
    }

    downloadFile(blob, filename);
    toast('Görsel indirildi, WhatsApp\'a ekleyebilirsin');
    setTimeout(() => {
      window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
    }, 350);
  } catch(e){
    console.error(e);
    toast('Paylaşım başarısız');
  }
}

/* yönetici girişi */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function unlock(pw){
  const o = await (await fetch('costs.json?'+Date.now())).json();
  if(!(window.crypto && crypto.subtle)){
    await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'crypto-fallback.js'; sc.onload = ok; sc.onerror = () => no(new Error('crypto-fallback.js yüklenemedi')); document.head.appendChild(sc); });
    await new Promise(r => setTimeout(r, 60));
    return JSON.parse(globalThis.__fallbackDecrypt(pw, o));
  }
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(o.s),iterations:200000,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['decrypt']);
  const d = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.i)}, key, b64(o.d));
  return JSON.parse(new TextDecoder().decode(d));
}
function setAdmin(on){
  $('lock').classList.toggle('on',on); $('lockt').textContent = on?'Çıkış':'Giriş';
  $('adminbar').style.display = on?'block':'none'; $('newb').style.display = on&&LOCAL?'':'none'; render();
}
async function doLogin(){
  const pw = $('pw').value; if(!pw) return;
  $('lok').disabled = true; $('lok').textContent = 'Doğrulanıyor…'; $('err').textContent=''; $('pw').classList.remove('bad');
  try {
    costs = await unlock(pw); PW = pw;
    try { localStorage.setItem(ADMIN_PW_KEY, pw); } catch(_){}
    closeOv('lov'); setAdmin(true); toast('Yönetici modu açıldı');
  }
  catch(e){
    $('err').textContent = e.name === 'OperationError' ? 'Parola yanlış, tekrar dene.' : 'Giriş yapılamadı: ' + e.message;
    if(e.name === 'OperationError') $('pw').classList.add('bad');
  }
  $('lok').disabled = false; $('lok').textContent = 'Giriş yap';
}
$('lock').onclick = () => {
  if(costs){
    costs=null; PW='';
    try { localStorage.removeItem(ADMIN_PW_KEY); } catch(_){}
    setAdmin(false); toast('Çıkış yapıldı'); return;
  }
  $('pw').value=''; $('err').textContent=''; $('pw').classList.remove('bad'); openOv('lov'); setTimeout(()=>$('pw').focus(),250);
};
$('lok').onclick = doLogin;
$('pw').onkeydown = e => { if(e.key==='Enter') doLogin(); };
$('lc').onclick = () => closeOv('lov');
$('eye').onclick = () => { const p=$('pw'); p.type = p.type==='password'?'text':'password'; };
$('lov').onclick = e => { if(e.target.id==='lov') closeOv('lov'); };

const openCart = () => { drawCart(); openOv('cov'); };
$('fopen').onclick = openCart; $('cx').onclick = () => closeOv('cov');
$('cov').onclick = e => { if(e.target.id==='cov') closeOv('cov'); };
document.onkeydown = e => { if(e.key==='Escape'){ if($('lb').classList.contains('show')){ closeOv('lb'); return; } closeOv('lov'); closeOv('cov'); closeOv('eov'); $('dd').classList.remove('open'); } };

let editId = null, delArm = false;
function edit(id){
  editId = id; delArm = false;
  const p = id === null ? {ad:'',satis:'',resim:'',kat:''} : P[id];
  $('etitle').textContent = id === null ? 'Yeni ürün' : 'Ürünü düzenle';
  $('f_ad').value = p.ad; $('f_alis').value = id === null ? '' : costs[id]; $('f_satis').value = p.satis;
  $('f_resim').value = p.resim; $('f_kat').value = p.kat;
  $('edel').style.display = id === null ? 'none' : ''; $('edel').textContent = 'Sil'; $('edel').classList.remove('arm');
  $('eerr').textContent = '';
  drawKch();
  openOv('eov');
}
function drawKch(){
  $('f_kat').classList.remove('bad');
  const v = $('f_kat').value.trim().toLowerCase();
  const cs = [...new Set(P.map(x => x.kat).filter(Boolean))].sort((a,b) => a.localeCompare(b,'tr'));
  $('kch').innerHTML = cs.length ? cs.map(k => `<button type="button" class="chip ${k.toLowerCase()===v?'on':''}" data-k="${esc(k)}">${esc(k)}</button>`).join('')
    : '<small>Henüz kategori yok, yukarıya yazarak oluştur.</small>';
}
$('kch').onclick = e => { const b = e.target.closest('.chip'); if(!b) return; $('f_kat').value = b.dataset.k; drawKch(); };
$('f_kat').oninput = drawKch;
async function api(body){
  const r = await fetch('api.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pw:PW, ...body})});
  const j = await r.json().catch(() => ({error:'Sunucu yanıtı okunamadı'}));
  if(!r.ok || j.error) throw new Error(j.error || 'Hata');
  return j;
}
async function reload(){
  P = await (await fetch('products.json?' + Date.now())).json();
  costs = await unlock(PW);
  drawChips(); render(); sum();
}
async function run(body, msg){
  $('esave').disabled = $('edel').disabled = true; $('eerr').textContent = ''; $('esave').textContent = 'Kaydediliyor…';
  try { await api(body); await reload(); closeOv('eov'); toast(msg); }
  catch(e){ $('eerr').textContent = e.message; }
  $('esave').disabled = $('edel').disabled = false; $('esave').textContent = 'Kaydet';
}
$('newb').onclick = () => edit(null);
$('esave').onclick = () => {
  const item = {id:editId, ad:$('f_ad').value, alis:$('f_alis').value, satis:$('f_satis').value, resim:$('f_resim').value, kat:$('f_kat').value};
  if(!item.ad.trim()){ $('eerr').textContent = 'Ürün adı gerekli.'; return; }
  if(!item.kat.trim()){ $('eerr').textContent = 'Kategori seçmek zorunlu.'; $('f_kat').classList.add('bad'); return; }
  run({action:'save', item}, 'Kaydedildi');
};
$('edel').onclick = () => {
  if(!delArm){ delArm = true; $('edel').textContent = 'Emin misin? Sil'; $('edel').classList.add('arm'); return; }
  cart = {}; save();
  run({action:'delete', id:editId}, 'Ürün silindi');
};
$('ec').onclick = () => closeOv('eov');
$('eov').onclick = e => { if(e.target.id === 'eov') closeOv('eov'); };

let DP = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); DP = e; $('inst').style.display = ''; });
addEventListener('appinstalled', () => { DP = null; $('inst').style.display = 'none'; toast('Uygulama yüklendi'); });
$('inst').onclick = async () => { if(!DP) return; DP.prompt(); await DP.userChoice; DP = null; $('inst').style.display = 'none'; };

addEventListener('scroll', () => $('top').classList.toggle('show', scrollY > 500), {passive:true});
$('top').onclick = () => scrollTo({top:0, behavior:'instant'});

$('q').oninput = () => { shown = STEP; render(); };
$('chips').onclick = e => { const b = e.target.closest('.chip'); if(!b) return; pickCat(b.dataset.c); };
$('ddb').onclick = e => { e.stopPropagation(); $('dd').classList.toggle('open'); };
$('ddm').onclick = e => { const b=e.target.closest('button'); if(!b) return; sort=b.dataset.s; shown=STEP; drawSort(); $('dd').classList.remove('open'); render(); };
document.addEventListener('click', () => $('dd').classList.remove('open'));
init();
</script>
</body>
</html>
